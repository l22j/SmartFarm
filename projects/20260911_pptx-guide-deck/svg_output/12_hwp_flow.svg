<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <marker id="arrowGray12" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,1 8,5 0,9" fill="#94A3B3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="64" y="106" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42" font-weight="800" fill="#1D2733">한글 문서(HWP) 처리 흐름</text>
    <text x="64" y="150" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">HWP는 직접 생성하는 스킬이 없어, docx 스킬로</text>
    <text x="64" y="188" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">회사 양식을 유지한 뒤 한컴에서 HWP로 저장한다</text>
  </g>

  <line x1="96" y1="270" x2="358" y2="270" stroke="#94A3B3" stroke-width="2" marker-end="url(#arrowGray12)"/>
  <line x1="390" y1="270" x2="652" y2="270" stroke="#94A3B3" stroke-width="2" marker-end="url(#arrowGray12)"/>
  <line x1="684" y1="270" x2="946" y2="270" stroke="#94A3B3" stroke-width="2" marker-end="url(#arrowGray12)"/>

  <g id="hwp-step-1">
    <circle cx="64" cy="270" r="30" fill="#1565C0"/>
    <text x="64" y="279" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
    <rect x="64" y="320" width="270" height="220" rx="14" fill="#F4F7FB"/>
    <use data-icon="tabler-outline/file-word" x="88" y="344" width="30" height="30" fill="#1565C0" stroke-width="2"/>
    <text x="88" y="410" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#1D2733">DOCX 생성</text>
    <text x="88" y="442" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">docx 스킬로 회사</text>
    <text x="88" y="466" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">양식 유지한 채 생성</text>
  </g>

  <g id="hwp-step-2">
    <circle cx="358" cy="270" r="30" fill="#1565C0"/>
    <text x="358" y="279" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
    <rect x="358" y="320" width="270" height="220" rx="14" fill="#F4F7FB"/>
    <use data-icon="tabler-outline/download" x="382" y="344" width="30" height="30" fill="#1565C0" stroke-width="2"/>
    <text x="382" y="410" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#1D2733">파일 다운로드</text>
    <text x="382" y="442" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">완성된 DOCX</text>
    <text x="382" y="466" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">파일 다운로드</text>
  </g>

  <g id="hwp-step-3">
    <circle cx="652" cy="270" r="30" fill="#1565C0"/>
    <text x="652" y="279" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
    <rect x="652" y="320" width="270" height="220" rx="14" fill="#F4F7FB"/>
    <use data-icon="tabler-outline/file-text" x="676" y="344" width="30" height="30" fill="#1565C0" stroke-width="2"/>
    <text x="676" y="410" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#1D2733">한컴오피스에서 열기</text>
    <text x="676" y="442" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">다운로드한 파일을</text>
    <text x="676" y="466" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">한컴에서 열기</text>
  </g>

  <g id="hwp-step-4">
    <circle cx="946" cy="270" r="30" fill="#FF6B35"/>
    <text x="946" y="279" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
    <rect x="946" y="320" width="270" height="220" rx="14" fill="#FF6B35" fill-opacity="0.08"/>
    <use data-icon="tabler-outline/circle-check" x="970" y="344" width="30" height="30" fill="#FF6B35" stroke-width="2"/>
    <text x="970" y="410" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#1D2733">HWP로 저장</text>
    <text x="970" y="442" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">다른 이름으로 저장</text>
    <text x="970" y="466" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">한글 문서(HWP) 선택</text>
  </g>

  <g id="footer-caption">
    <rect x="64" y="600" width="820" height="42" rx="21" fill="#F4F7FB"/>
    <text x="94" y="626" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#5B6B7C">DOCX-HWP 서식은 완벽히 유지되지 않을 수 있어 직접 확인 필요</text>
  </g>

  <g id="page-number">
    <text x="1216" y="690" text-anchor="end" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="16" fill="#94A3B3">12 / 14</text>
  </g>
</svg>
