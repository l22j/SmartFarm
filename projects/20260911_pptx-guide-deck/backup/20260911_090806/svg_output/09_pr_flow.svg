<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <marker id="arrowGray09" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,1 8,5 0,9" fill="#94A3B3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="64" y="106" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42" font-weight="800" fill="#1D2733">결과 확인과 GitHub 자동 반영</text>
    <text x="64" y="150" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">Claude가 만든 PPT는 자동으로 브랜치·PR로 올라오며,</text>
    <text x="64" y="188" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">사용자는 PR 링크에서 Merge 한 번으로 최종 반영한다</text>
  </g>

  <line x1="254" y1="335" x2="292" y2="335" stroke="#94A3B3" stroke-width="2.5" marker-end="url(#arrowGray09)"/>
  <line x1="482" y1="335" x2="520" y2="335" stroke="#94A3B3" stroke-width="2.5" marker-end="url(#arrowGray09)"/>
  <line x1="710" y1="335" x2="748" y2="335" stroke="#94A3B3" stroke-width="2.5" marker-end="url(#arrowGray09)"/>
  <line x1="938" y1="335" x2="976" y2="335" stroke="#94A3B3" stroke-width="2.5" marker-end="url(#arrowGray09)"/>

  <g id="pr-node-1">
