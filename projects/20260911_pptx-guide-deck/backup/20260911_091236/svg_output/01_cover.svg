<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="cover">
  <defs>
    <radialGradient id="bgDecor" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <circle cx="1050" cy="150" r="380" fill="url(#bgDecor)" fill-opacity="0.14"/>
    <circle cx="1130" cy="90" r="150" fill="#FF6B35" fill-opacity="0.10"/>
  </g>

  <g id="eyebrow-badge">
    <rect x="112" y="120" width="248" height="56" rx="28" fill="#F4F7FB"/>
    <use data-icon="tabler-outline/browser" x="132" y="134" width="28" height="28" fill="#1565C0" stroke-width="2"/>
    <text x="172" y="154" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" font-weight="700" fill="#1565C0">브라우저 Claude Code</text>
  </g>

  <g id="hero-title">
    <text x="110" y="330" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="72" font-weight="800" fill="#1D2733">브라우저 Claude Code로</text>
    <text x="110" y="420" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="72" font-weight="800" fill="#1D2733">문서 자동화 시작</text>
  </g>

  <g id="subtitle">
    <rect x="112" y="460" width="6" height="40" rx="3" fill="#FF6B35"/>
    <text x="136" y="490" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="32" font-weight="600" fill="#5B6B7C">설치 없이, 브라우저만으로</text>
  </g>

  <g id="info-line">
    <use data-icon="tabler-outline/robot" x="112" y="560" width="24" height="24" fill="#94A3B3" stroke-width="2"/>
    <text x="146" y="578" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#94A3B3">사내 온보딩 세션</text>
  </g>
</svg>
