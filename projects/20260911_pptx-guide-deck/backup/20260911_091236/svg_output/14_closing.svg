      <stop offset="0%" stop-color="#0D47A1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <circle cx="180" cy="640" r="360" fill="url(#bgDecor14)" fill-opacity="0.12"/>
  </g>

  <g id="eyebrow">
