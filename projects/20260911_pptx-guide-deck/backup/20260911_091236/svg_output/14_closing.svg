    <text x="640" y="404" text-anchor="middle" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#5B6B7C">다음부터는 이름만 불러 그대로 재사용한다</text>
  </g>

  <g id="tag-1">
