  </g>
  <g id="tag-3">
    <rect x="660" y="460" width="200" height="60" rx="30" fill="#F4F7FB"/>
    <use data-icon="tabler-outline/book" x="684" y="475" width="26" height="26" fill="#1565C0" stroke-width="2"/>
