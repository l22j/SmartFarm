    <text x="496" y="120" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" font-weight="600" fill="#1D2733">오늘 핵심 한 줄</text>
  </g>

  <g id="quote">
    <text x="640" y="260" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42" font-weight="800" fill="#1D2733">Skill은 일하는 방법,</text>
    <text x="640" y="316" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42" font-weight="800" fill="#1565C0">Subagent는 특정 역할 담당자다</text>
