<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FBF3E7"/>

  <g id="header">
    <text x="64" y="106" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42" font-weight="800" fill="#2B2420">저장소 준비: slide-master Fork</text>
    <text x="64" y="150" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">초보자는 slide-master 저장소를 Fork해서</text>
    <text x="64" y="188" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="30" font-weight="600" fill="#0D47A1">오늘 실습용 저장소로 사용한다</text>
  </g>

  <path d="M 246,300 Q 280,286 318,300" fill="none" stroke="#A69783" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="310,292 320,300 310,308" fill="#A69783"/>
  <path d="M 638,300 Q 672,286 710,300" fill="none" stroke="#A69783" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="702,292 712,300 702,308" fill="#A69783"/>

  <g id="fork-step-1">
    <circle cx="244" cy="300" r="36" fill="#1565C0"/>
    <text x="244" y="309" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="800" fill="#FFF8EC">1</text>
    <rect x="64" y="360" width="360" height="220" rx="14" fill="#FFF8EC" stroke="#2B2420" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="phosphor-duotone/github-logo" x="96" y="392" width="32" height="32" fill="#1565C0"/>
    <text x="96" y="462" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#2B2420">Fork 클릭</text>
    <text x="96" y="494" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">slide-master 저장소</text>
    <text x="96" y="520" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">우상단 Fork 버튼 클릭</text>
  </g>

  <g id="fork-step-2">
    <circle cx="636" cy="300" r="36" fill="#1565C0"/>
    <text x="636" y="309" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="800" fill="#FFF8EC">2</text>
    <rect x="456" y="360" width="360" height="220" rx="14" fill="#FFF8EC" stroke="#2B2420" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="phosphor-duotone/check-circle" x="488" y="392" width="32" height="32" fill="#1565C0"/>
    <text x="488" y="462" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#2B2420">Create fork 클릭</text>
    <text x="488" y="494" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">Owner·Repository name</text>
    <text x="488" y="520" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">확인 후 진행</text>
  </g>

  <g id="fork-step-3">
    <circle cx="1028" cy="300" r="36" fill="#FF6B35"/>
    <text x="1028" y="309" text-anchor="middle" font-family="&quot;Pretendard ExtraBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="800" fill="#FFF8EC">3</text>
    <rect x="848" y="360" width="368" height="220" rx="14" fill="#FFF8EC" stroke="#FF6B35" stroke-width="2"/>
    <use data-icon="phosphor-duotone/git-branch" x="880" y="392" width="32" height="32" fill="#FF6B35"/>
    <text x="880" y="462" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="24" font-weight="600" fill="#2B2420">저장소 연결</text>
    <text x="880" y="494" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">Claude Code에서 Fork한</text>
    <text x="880" y="520" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" fill="#6B5D4F">저장소 선택 및 연결</text>
  </g>

  <g id="warning-caption">
    <rect x="64" y="620" width="1152" height="60" rx="14" fill="#FFF8EC" stroke="#C62828" stroke-width="2"/>
    <use data-icon="phosphor-duotone/lock" x="96" y="636" width="28" height="28" fill="#C62828"/>
    <text x="140" y="658" font-family="&quot;Pretendard SemiBold&quot;, Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18" font-weight="600" fill="#C62828">회사 기밀 저장소는 반드시 Private로 설정</text>
  </g>

  <g id="page-number">
    <text x="1216" y="710" text-anchor="end" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="16" fill="#A69783">6 / 14</text>
  </g>
